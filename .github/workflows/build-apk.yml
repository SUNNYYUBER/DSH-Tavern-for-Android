name: build-apk

# W-F（GOAL-ANDROID-GAP-2026-09-21）：CI 出包。
# 复现 build-dsht.ps1 完整链（fetch-native-libs → pnpm 构建 → 48 门禁 → gradle），
# 产出与本地同口径的 x86_64 debug APK（arm64 release 需签名密钥，配置 secrets 后再开）。
# 触发：手动（workflow_dispatch）+ 推 v* tag。

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build-x64:
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      # Python 门禁输出含中文；CI 控制台缺省 cp437/cp1252 会 UnicodeEncodeError（第八跑实证）
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # build-dsht.ps1 期望 gradle 在 rp-workspace/downloads/gradle/gradle-8.14
      # （与本地同路径，免改脚本；缓存避免每次 130MB 下载）
      - name: Provision Gradle 8.14
        id: gradle
        shell: pwsh
        run: |
          $dst = "rp-workspace/downloads/gradle"
          if (-not (Test-Path "$dst/gradle-8.14/bin/gradle.bat")) {
            New-Item -ItemType Directory -Force $dst | Out-Null
            Invoke-WebRequest -Uri "https://services.gradle.org/distributions/gradle-8.14-bin.zip" -OutFile "$dst/gradle-8.14-bin.zip"
            Expand-Archive -Path "$dst/gradle-8.14-bin.zip" -DestinationPath $dst
            Remove-Item "$dst/gradle-8.14-bin.zip"
          }
          if (-not (Test-Path "$dst/gradle-8.14/bin/gradle.bat")) { throw "gradle 就位失败" }

      # Android SDK：windows-latest 自带（ANDROID_HOME 已设）；确认 cmdline-tools 在
      - name: Android SDK check
        shell: pwsh
        run: |
          Write-Host "ANDROID_HOME=$env:ANDROID_HOME"
          if (-not $env:ANDROID_HOME) { throw "ANDROID_HOME 未设" }

      # packages 依赖就位（Step 0.5 的 AST 类门禁要 typescript 等 devDependencies；
      # 构建脚本内的完整安装在门禁之后——没有这一步，CI 净环境必炸在 audit-body-dup-ast。
      # 注意 rp-workspace 根**没有** pnpm-workspace.yaml，装根目录不覆盖 packages/ 的 devDeps）
      - name: Install workspace dependencies (pnpm)
        shell: pwsh
        run: |
          npx -y pnpm@10 install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { throw "pnpm install failed: $LASTEXITCODE" }
        working-directory: rp-workspace/packages

      # TH vendor 自愈（jquery/zod 等不进锁文件的 5 包）+ rp-ui 构建
      # （th-vendor.gen.txt 是生成物、gitignore 不入库——audit-th-face-coverage 要它；
      # 没有这两步，CI 净环境必炸在 Could not resolve "./th-vendor.gen.txt?raw"）
      - name: Vendor deps self-heal + build rp-ui (gen files)
        shell: pwsh
        run: |
          node .\rp-workspace\scripts\vendor-deps.mjs
          if ($LASTEXITCODE -ne 0) { throw "vendor-deps failed: $LASTEXITCODE" }
          node .\rp-workspace\scripts\build-rp-ui.mjs
          if ($LASTEXITCODE -ne 0) { throw "build-rp-ui failed: $LASTEXITCODE" }

      # DSH 运行时预装（门禁在脚本 Step 1 安装之前跑，audit-session-integrity 的自证
      # 要 dsh-runtime-src 里的官方实现——没有这步，CI 净环境必炸 fail-closed。
      # 与 build-dsht.ps1 Step 1 同口径；脚本随后会重删重装一遍（幂等，保证其自证不变量）
      - name: Pre-install DSH runtime (gate prerequisite)
        shell: pwsh
        run: |
          $src = "rp-workspace/dsh-runtime-src"
          New-Item -ItemType Directory -Force $src | Out-Null
          [IO.File]::WriteAllText("$src/package.json", "{`"dependencies`": {`"@deepseek-ai/dsh`": `"0.1.5-rc.1`", `"dsh-preset-enhance`": `"0.3.2-rc.1`"}}")
          Push-Location $src
          npx -y pnpm@10 install --node-linker=hoisted --registry=https://registry.npmmirror.com
          if ($LASTEXITCODE -ne 0) { Pop-Location; throw "pnpm install dsh failed: $LASTEXITCODE" }
          Pop-Location
          if (-not (Test-Path "$src/node_modules/@deepseek-ai/dsh/lib/bin.js")) { throw "dsh bin.js 未就位" }

      # 原生库就位（Termux deb + deb 级 SHA256 校验；构建脚本 Step 0.1 只做检查不自动补）
      - name: Fetch native libs (Termux debs, SHA256-verified)
        shell: pwsh
        run: |
          node .\rp-workspace\scripts\fetch-native-libs.mjs
          if ($LASTEXITCODE -ne 0) { throw "fetch-native-libs failed: $LASTEXITCODE" }

      # 完整链：不传 -SkipInstall（CI 无既有 runtime）
      - name: Build x86_64 debug APK
        shell: pwsh
        run: |
          & .\rp-workspace\scripts\build-dsht.ps1 -DshVersion 0.1.5-rc.1 -Arch x86_64
          if ($LASTEXITCODE -ne 0) { throw "build-dsht.ps1 failed: $LASTEXITCODE" }

      - uses: actions/upload-artifact@v4
        with:
          name: DSH-Tavern-x86_64-debug-apk
          path: DSH-Tavern-*-x86_64-debug.apk
          retention-days: 30
